name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sanjjayrj
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#111,#333,#555,#999,#fff
            dist/snake-raw.gif?palette=github-dark&color_snake=#ffffff&color_dots=#111,#333,#555,#999,#fff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove progress bar
        run: |
          sudo chmod -R 777 dist/
          # Strip progress bar from SVG
          sed -i 's/<rect class="u[^"]*"[^\/]*\/>//g' dist/snake-dark.svg
          sed -i 's/\.u{[^}]*}//g' dist/snake-dark.svg
          sed -i 's/\.u[0-9]*{[^}]*}//g' dist/snake-dark.svg
          sed -i 's/viewBox="-16 -32 880 192"/viewBox="-16 -32 880 176"/' dist/snake-dark.svg
          sed -i 's/height="192"/height="176"/' dist/snake-dark.svg
          # Crop bottom 16px off GIF (progress bar area)
          sudo apt-get install -y gifsicle > /dev/null 2>&1
          gifsicle --crop 0,0-880,160 dist/snake-raw.gif -o dist/snake.gif
          rm dist/snake-raw.gif

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
