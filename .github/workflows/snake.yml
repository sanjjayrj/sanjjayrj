name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sanjjayrj
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#111,#333,#555,#999,#fff
            dist/snake.gif?palette=github-dark&color_snake=#ffffff&color_dots=#111,#333,#555,#999,#fff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
